<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Correnteza</title>

  <!-- Tipografia do Subtítulo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

  <style>
    /* 1. Carregamento da Fonte Local */
    @font-face {
      font-family: 'Aqua Monstera';
      src: url('fonts/Aqua Monstera.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Merriweather', serif;
      background-color: #F9F7F2; /* Cor clara do fundo da imagem */
      color: #1F3547; /* Azul escuro do texto */
    }

    /* Container Principal ocupando 100% da tela */
    .hero-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* Faixa do Cabeçalho */
    header {
      width: 100%;
      height: 50px;
      background-color: #1F3547;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 25px;
      z-index: 10;
    }

    .icon-placeholder {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(180deg, #78C8E6 0%, #78C8E6 50%, #83C35C 50%, #83C35C 100%);
      border: 1.5px solid #FFFFFF;
    }

    .header-title {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 300;
    }

    /* Ilustração de Fundo (Caiaque no Rio) */
    .background-drawing {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      max-width: 900px;
      height: auto;
      opacity: 0.85;
      pointer-events: none;
      z-index: 1;
    }

    /* Bloco Central Perfeitamente Alinhado */
    main {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -52%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      padding: 0 20px;
      z-index: 2;
    }

    /* Título com a Fonte Aqua Monstera e Efeito Água */
    .title-correnteza {
      font-family: 'Aqua Monstera', sans-serif;
      font-size: clamp(4rem, 13vw, 10rem);
      color: #1F3547;
      letter-spacing: 2px;
      line-height: 1;
      margin-bottom: 15px;
      
      /* Efeito de Balanço/Ondulação de Água */
      animation: waterWave 4s ease-in-out infinite alternate;
      transform-origin: center center;
    }

    @keyframes waterWave {
      0% {
        transform: translateY(0px) skewX(0deg) scaleY(1);
      }
      25% {
        transform: translateY(-3px) skewX(-1deg) scaleY(1.01);
      }
      50% {
        transform: translateY(2px) skewX(0.8deg) scaleY(0.99);
      }
      75% {
        transform: translateY(-2px) skewX(-0.5deg) scaleY(1.005);
      }
      100% {
        transform: translateY(3px) skewX(1deg) scaleY(0.995);
      }
    }

    .subtitle {
      font-size: clamp(1rem, 2.2vw, 1.5rem);
      color: #1F3547;
      font-weight: 400;
      line-height: 1.4;
      max-width: 650px;
    }

    /* Onda Azul Escura do Rodapé */
    .footer-wave {
      width: 100%;
      line-height: 0;
      z-index: 3;
    }

    .footer-wave svg {
      width: 100%;
      height: 16vh;
      min-height: 100px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <!-- Cabeçalho Superior -->
    <header>
      <div class="icon-placeholder"></div>
      <div class="header-title">Página 1</div>
    </header>

    <!-- Desenho Ilustrativo de Fundo -->
    <img src="images/desenho-fundo.png" alt="Desenho Caiaque no Rio" class="background-drawing">

    <!-- Conteúdo Centralizado -->
    <main>
      <h1 class="title-correnteza">CORRENTEZA</h1>
      <p class="subtitle">Uma reportagem sobre arte,<br>identidade e nordestinidade</p>
    </main>

    <!-- Onda Inferior -->
    <div class="footer-wave">
      <svg viewBox="0 0 1440 220" preserveAspectRatio="none">
        <path fill="#1F3547" d="M0,80 C360,180 720,0 1080,120 C1260,180 1380,100 1440,80 L1440,220 L0,220 Z"></path>
      </svg>
    </div>
  </div>

</body>
</html>
