
<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Correnteza</title>

<style>

/* FONTE ESPECÍFICA */

@font-face {
    font-family: "Aqua Monstera";
    src: url("./fonts/AquaMonstera.otf") format("opentype");
    font-weight: normal;
    font-style: normal;
}


/* CONFIGURAÇÃO GERAL */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #211f20;
    color: white;

    width: 100%;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* CAPA */

.capa {
    width: 100%;
    min-height: 100vh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    padding: 30px;
}


/* TITULO */

.titulo {
    font-family: "Aqua Monstera", sans-serif;

    font-size: clamp(60px, 13vw, 180px);

    font-weight: normal;

    color: #ffffff;

    text-align: center;

    white-space: nowrap;

    line-height: 1;

    margin-bottom: 45px;

    animation: correnteza 5s ease-in-out infinite;

    filter: url(#efeito-agua);
}


/* MOVIMENTO DE AGUA */

@keyframes correnteza {

    0% {
        transform: translateY(0) skewX(0deg);
    }

    20% {
        transform: translateY(3px) skewX(-2deg);
    }

    40% {
        transform: translateY(-3px) skewX(2deg);
    }

    60% {
        transform: translateY(2px) skewX(-1deg);
    }

    80% {
        transform: translateY(-2px) skewX(1deg);
    }

    100% {
        transform: translateY(0) skewX(0deg);
    }

}


/* SUBTITULO */

.subtitulo {

    font-family: Georgia, serif;

    font-size: clamp(25px, 4vw, 48px);

    font-weight: bold;

    line-height: 0.98;

    text-align: center;

    color: #8050d4;

    max-width: 900px;

}


/* CELULAR */

@media (max-width: 768px) {

    .titulo {
        font-size: 15vw;
        white-space: normal;
        margin-bottom: 30px;
    }

    .subtitulo {
        font-size: 7vw;
    }

}

</style>

</head>

<body>


<!-- EFEITO LIQUIDO -->

<svg width="0" height="0">

    <filter id="efeito-agua">

        <feTurbulence
            type="fractalNoise"
            baseFrequency="0.012 0.035"
            numOctaves="2"
            seed="8"
            result="ruido">

            <animate
                attributeName="baseFrequency"
                values="0.012 0.035; 0.018 0.025; 0.012 0.035"
                dur="6s"
                repeatCount="indefinite"
            />

        </feTurbulence>

        <feDisplacementMap
            in="SourceGraphic"
            in2="ruido"
            scale="8"
            xChannelSelector="R"
            yChannelSelector="G">

            <animate
                attributeName="scale"
                values="4;10;5;8;4"
                dur="5s"
                repeatCount="indefinite"
            />

        </feDisplacementMap>

    </filter>

</svg>


<!-- CAPA -->

<main class="capa">

    <h1 class="titulo">
        CORRENTEZA
    </h1>

    <p class="subtitulo">
        Uma reportagem sobre arte,<br>
        identidade e nordestinidade
    </p>

</main>


</body>

</html>
